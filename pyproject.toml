[project]
name = "reference-auditing-fewshot"
version = "1.0.0"
description = "Training-free reference auditing for few-shot industrial visual inspection"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn",
    "Pillow",
    "transformers",
]

[project.optional-dependencies]
# Nearest-neighbor search for the experiment scripts.
faiss = [
    "faiss-cpu",
]
# Lowers process priority during long CPU runs (graceful fallback if absent).
throttle = [
    "psutil",
]
